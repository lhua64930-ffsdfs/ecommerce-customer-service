[project]
name = "ecommerce-customer-service-backend"
version = "1.0.0"
description = "售后智答后端 - FastAPI + LLM + RAG + NLU"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
