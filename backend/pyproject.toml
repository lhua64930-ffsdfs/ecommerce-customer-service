[project]
name = "ecommerce-customer-service-backend"
version = "1.0.0"
description = "电商智能客服系统后端 - FastAPI + LLM + RAG + NLU"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
