# RAG 检索配置。
rag:
  embedding:
    provider: "local" # DeepSeek 无 embedding 接口,使用本地模型
    model: "BAAI/bge-small-zh-v1.5"
    dimension: 512
    batch_size: 32

  vector_store:
    type: "milvus"
    uri: "http://127.0.0.1:19530"
    collection: "knowledge_base"
    metric_type: "COSINE"
    top_k: 3
    similarity_threshold: 0.3

  retrieval:
    # Milvus / Embedding 不可用时降级为本地关键词检索
    fallback_keyword: true
    max_context_length: 4000
