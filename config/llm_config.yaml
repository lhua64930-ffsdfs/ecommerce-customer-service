# LLM 配置参考。
# 运行时实际以 backend/.env 为准;本文件用于部署说明与切换记录。
llm:
  provider: "deepseek" # deepseek / openai / local / mock

  deepseek:
    api_key: "${LLM_API_KEY}"
    model: "deepseek-chat"
    api_base: "https://api.deepseek.com/v1"
    max_tokens: 2000
    temperature: 0.7

  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o-mini"
    api_base: "https://api.openai.com/v1"
    max_tokens: 2000
    temperature: 0.7

  # 本地 vLLM / Ollama 等 OpenAI 兼容服务
  local:
    api_base: "http://localhost:8000/v1"
    model: "Qwen/Qwen2.5-7B-Instruct"
    max_tokens: 2000
    temperature: 0.7
