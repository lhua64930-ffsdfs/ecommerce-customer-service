# 生产/整体部署编排:基础设施 + 后端 + 前端 + Nginx
# 启动: docker compose -f docker/docker-compose.yml up -d --build
# 说明:Milvus 使用官方单机本地存储模式(MinIO 官方镜像自 2025 年起停止公共分发)。
#       Milvus 镜像版本为 v2.5.4(文档的 v2.3.3 客户端不兼容 Python 3.13)。

name: ecommerce-cs

services:
  # ---------------- 基础设施 ----------------
  mysql:
    image: mysql:8.0
    container_name: cs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: customer_service
      MYSQL_USER: cs_user
      MYSQL_PASSWORD: cs_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cs-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: cs-milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: cs-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
      LOCAL_STORAGEPATH: /var/lib/milvus/data
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

  # ---------------- 后端 ----------------
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: cs-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://cs_user:cs_password@mysql:3306/customer_service?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: knowledge_base
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-this-secret-in-production}
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - ../knowledge_base:/workspace/knowledge_base:ro
      - ../config:/workspace/config:ro
      - app_logs:/workspace/logs
      - hf_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ---------------- 前端(构建产物由 nginx 托管) ----------------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: cs-frontend
    restart: unless-stopped
    depends_on:
      - backend

  # ---------------- Nginx 反向代理入口 ----------------
  nginx:
    image: nginx:alpine
    container_name: cs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  milvus_data:
  app_logs:
  hf_cache:
