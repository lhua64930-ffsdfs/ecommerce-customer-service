# 开发环境基础设施:MySQL 8 + Redis 7 + Milvus(etcd + MinIO + standalone)
# 启动: docker compose -f docker/docker-compose.dev.yml up -d
# 查看: docker compose -f docker/docker-compose.dev.yml ps
# 停止: docker compose -f docker/docker-compose.dev.yml down
#
# 说明:Milvus 版本从文档的 v2.3.3 升到 v2.5.4,原因是 Python 3.13 下
#      pymilvus 2.3.x 无可用依赖;组件构成与官方 standalone 部署保持一致。

name: ecommerce-cs

services:
  # ---------------- MySQL: 业务数据 ----------------
  mysql:
    image: mysql:8.0
    container_name: cs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: customer_service
      MYSQL_USER: cs_user
      MYSQL_PASSWORD: cs_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------- Redis: 缓存 / 会话 / 限流 ----------------
  redis:
    image: redis:7-alpine
    container_name: cs-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------- Milvus 依赖: etcd ----------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: cs-milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------- Milvus standalone: 向量数据库 ----------------
  # 说明:MinIO 官方镜像自 2025 年起不再公共分发(Docker Hub / Quay 均 401),
  #      因此使用 Milvus 官方支持的单机本地存储模式(COMMON_STORAGETYPE=local),
  #      数据持久化在 milvus_data 卷,功能与 MinIO 模式等价。
  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: cs-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
      LOCAL_STORAGEPATH: /var/lib/milvus/data
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # 健康检查 / metrics
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  milvus_data:
